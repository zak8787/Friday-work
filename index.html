    .input-group input {
      width: 100%; padding: 12px 16px; border: 1.5px solid #CBD5E1; border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s;

function initData() {
  MENU_RAW.forEach(item => {

  });

  CUSTOMER_LIST.forEach(([id, name]) => {

  });

  let seed = 42;
  function rand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }
  const quantities = [1, 1, 1, 1, 1, 1, 1, 1, 2, 2, 2, 3, 3, 4, 5, 6, 8, 10];

    if (!userCategoryStats[custId]) userCategoryStats[custId] = {};

  }
}

initData();

// ============================================================
// 2. 協同過濾推薦演算法 (Cosine Similarity)
// ============================================================
function calculateCosineSimilarity(userA, userB) {
  const vecA = userDishMatrix[userA];
  const vecB = userDishMatrix[userB];
  if (!vecA || !vecB) return 0;

  let dotProduct = 0, normA = 0, normB = 0;
  for (let d in vecA) normA += vecA[d] ** 2;
  for (let d in vecB) normB += vecB[d] ** 2;
  for (let d in vecA) {
    if (vecB[d]) dotProduct += vecA[d] * vecB[d];
  }
  if (normA === 0 || normB === 0) return 0;
  return dotProduct / (Math.sqrt(normA) * Math.sqrt(normB));
}

function getRecommendations(targetCustId, topN = 6) {
  const eatenDishCodes = new Set(Object.keys(userDishMatrix[targetCustId] || {}));
  const targetCategoryStats = userCategoryStats[targetCustId] || {};

  const neighbors = [];
  for (let otherId in userDishMatrix) {
    if (otherId !== targetCustId) {
      const sim = calculateCosineSimilarity(targetCustId, otherId);
      if (sim > 0) neighbors.push({ custId: otherId, sim });
    }
  }
  neighbors.sort((a, b) => b.sim - a.sim);

  const candidateScores = {};
  neighbors.forEach(({ custId, sim }) => {
    const dishes = userDishMatrix[custId];
    for (let dishCode in dishes) {
      if (!eatenDishCodes.has(dishCode)) {
        if (!candidateScores[dishCode]) candidateScores[dishCode] = { score: 0, count: 0 };
        candidateScores[dishCode].score += sim * dishes[dishCode];
        candidateScores[dishCode].count += 1;
      }
    }
  });

  const rankedDishes = [];
  for (let dishCode in candidateScores) {
    const item = menuMap.get(dishCode);
    if (!item) continue;
    const catWeight = targetCategoryStats[item.category] || 1;
    const finalScore = candidateScores[dishCode].score * (1 + Math.log1p(catWeight));

    rankedDishes.push({
      ...item,
      score: finalScore,
      reason: `與您點餐喜好相似的熟客一致推薦，且符合您喜愛的「${item.category}」品味！`
    });
  }

  if (rankedDishes.length < topN) {
    const popularFallbacks = Array.from(menuMap.values())
      .filter(d => !eatenDishCodes.has(d.dishCode) && !candidateScores[d.dishCode])
      .sort((a, b) => (globalDishPopularity[b.dishCode] || 0) - (globalDishPopularity[a.dishCode] || 0));

    popularFallbacks.forEach(dish => {
      if (rankedDishes.length < topN) {
        rankedDishes.push({
          ...dish,
          score: (globalDishPopularity[dish.dishCode] || 1) * 0.1,
          reason: `崑大台味豐閣人氣熱銷招牌，誠摯推薦您首次嚐鮮！`
        });
      }
    });
  }

  rankedDishes.sort((a, b) => b.score - a.score);

  return {
    recommendations: rankedDishes.slice(0, topN),
    eatenList: Array.from(eatenDishCodes).map(code => menuMap.get(code)).filter(Boolean)
  };
}

function executeRecommendation() {
  const input = document.getElementById("custInput");
  const query = input.value.trim();
  const profileArea = document.getElementById("userProfileArea");

  if (!query) {
    alert("請輸入消費者編號或姓名！");
    return;
  }

  let targetCustId = null;
  let targetCustName = null;
  const upperQuery = query.toUpperCase();

  if (customerMap.has(upperQuery) && upperQuery.startsWith("CUST-")) {
    targetCustId = upperQuery;
    targetCustName = customerMap.get(upperQuery);
  } else if (customerMap.has(query)) {
    targetCustName = query;
    targetCustId = customerMap.get(query);
  } else {
    for (let [k, v] of customerMap.entries()) {
      if (k.includes(query) || v.includes(query)) {
        if (k.startsWith("CUST-")) {
          targetCustId = k;
          targetCustName = v;
        } else {
          targetCustName = k;
          targetCustId = v;
        }
        break;
      }
    }
  }

  if (!targetCustId) {
    profileArea.innerHTML = "";
    recArea.innerHTML = `<div class="empty-state">❌ 在資料庫中查無「${query}」，請確認是否輸入正確。</div>`;
    return;
  }

  const result = getRecommendations(targetCustId, 6);

  const eatenChips = result.eatenList.length > 0
    ? result.eatenList.map(d => `<span class="history-badge">✓ ${d.dishName} (${d.category})</span>`).join("")
    : '<span style="color:#888;">查無過往點餐紀錄</span>';

  profileArea.innerHTML = `
    <div class="user-profile">
      <h3>👤 消費者檔案：${targetCustName} <span style="font-size:13.5px; color:#64748B; font-weight:normal;">[編號: ${targetCustId}]</span></h3>
      <p style="font-size:13px; color:#475569;">歷史已點過菜色（共 <strong>${result.eatenList.length}</strong> 項，推薦系統已徹底排除）：</p>
      <div class="user-history-tags">${eatenChips}</div>
    </div>
  `;

  if (result.recommendations.length === 0) {
    recArea.innerHTML = `<div class="empty-state">該顧客已點過所有菜色，目前暫無未點過項目。</div>`;
    return;
  }

  let html = `
    <div class="section-title">✨ 崑大台味豐閣專屬推薦 — 6 道從未點過的精選台菜</div>
    <div class="cards-grid">
  `;

  result.recommendations.forEach((dish, idx) => {
    const badgeColor = CATEGORY_COLORS[dish.category] || "#666";
    html += `
      <div class="card">
        <div>
          <div class="card-top">
            <div>
              <div class="dish-title">${idx + 1}. ${dish.dishName}</div>
              <div class="dish-code">${dish.dishCode}</div>
            </div>
            <span class="category-badge" style="background:${badgeColor}">${dish.category}</span>
          </div>
          <div class="price-tag">NT$ ${dish.price}</div>
        </div>
        <div class="reason-box">
          💡 <strong>推薦依據：</strong>${dish.reason}
        </div>
      </div>
    `;
  });

  html += `</div>`;
  recArea.innerHTML = html;
}

document.getElementById("custInput").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    executeRecommendation();
  }
});

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("custInput").focus();
});
</script>

</body>
</html>
